<!DOCTYPE html>
<html>
<head>
<title>News Page</title>
<style>
body {
    background: url('news-background.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family: 'Malgun Gothic', 'Lucida Grande', sans-serif;
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    box-sizing: border-box;
}
.card {
    background: rgba(255,255,255,0.85);
    border-radius: 10px;
    padding: 14px 18px;
    display: inline-block;
    color: #111111;
}
h1 { margin: 0 0 8px 0; color: #111111; }
p { margin: 0; color: #111111; }
a { color: #1a5cb8; }
</style>
</head>
<body>
<div class="card">
<h1>이즈나 온라인</h1>
<p>공지사항은 디스코드에서 확인해주세요.</p>
</div>
</body>
</html>
